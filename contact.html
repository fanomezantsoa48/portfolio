  <section class="contact-section">
    <div class="container">
      <h1 class="section-title">Contactez-moi</h1>
      <div class="contact-container">
        <div class="contact-info">
          <h2><i class="fas fa-info-circle"></i> Informations de contact</h2>
          <div class="contact-item">
            <i class="fas fa-envelope"></i>
            <span>fitahianafenofanomezana@gmail.com</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-phone"></i>
            <span>+261 38 32 335 36 / 034 20 401 54</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>Antananarivo, Madagascar</span>
          </div>

          <h2><i class="fas fa-share-alt"></i> Réseaux sociaux</h2>
          <div class="social-links">
            <a href="https://github.com/fanomezantsoa48" target="_blank" class="social-link">
              <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://www.facebook.com/profile.php?id=61580009723610" target="_blank" class="social-link">
              <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="mailto:fitahianafenofanomezana@gmail.com" class="social-link">
              <i class="fas fa-envelope"></i> Email
            </a>
            <a href="https://wa.me/+2613832333536" target="_blank" class="social-link">
              <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
          </div>
        </div>

        <div class="contact-form">
          <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <div id="status" class="status"></div>

            <div class="form-group">
              <label for="name">Nom complet</label>
              <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
              <label for="subject">Sujet</label>
              <input type="text" id="subject" name="subject" required>
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn pulse">
              <i class="fas fa-paper-plane"></i> Envoyer le message
            </button>
          </form>
        </div>

  </section>
